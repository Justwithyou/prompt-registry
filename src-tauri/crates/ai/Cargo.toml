[package]
name = "ai"
version = "0.1.0"
edition = "2021"

[dependencies]
# crate 名 "core" 与标准库 core 冲突，引用处使用别名 prompt_core（package 仍名为 core）
prompt_core = { package = "core", path = "../core" }
# 模板变量提取（生成结果 `{{变量}}` 与模板引擎契约一致）
template = { path = "../template" }
# OpenAI 兼容 HTTP 调用（阻塞式 + rustls，与 sync/webdav 同技术栈）
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
prompt_core = { package = "core", path = "../core" }