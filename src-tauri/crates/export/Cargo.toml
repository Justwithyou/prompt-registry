[package]
name = "export"
version = "0.1.0"
edition = "2021"

[dependencies]
# crate 名 "core" 与标准库 core 冲突，引用处使用别名 prompt_core（package 仍名为 core）
prompt_core = { package = "core", path = "../core" }
template = { path = "../template" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
storage = { path = "../storage" }