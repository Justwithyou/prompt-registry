[package]
name = "ipc"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
# crate 名 "core" 与标准库 core 冲突，引用处使用别名 prompt_core（package 仍名为 core）
prompt_core = { package = "core", path = "../core" }
# 同步命令层：构建 WebDAV 远程（sync）并从 Master Key 派生同步密钥（crypto）
sync = { path = "../sync" }
crypto = { path = "../crypto" }
# 导出命令层：复用 export 单一导出内核
export = { path = "../export" }
# 保险库命令层：setup/unlock 联动数据库 rekey / reopen（Db 句柄）
storage = { path = "../storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"